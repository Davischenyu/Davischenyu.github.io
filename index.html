<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站维护中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .maintenance-card {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 50px 40px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }

        .maintenance-card:hover {
            transform: translateY(-4px);
        }

        .icon {
            font-size: 72px;
            margin-bottom: 16px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 12px;
        }

        .sub {
            font-size: 16px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .sub strong {
            color: #1a1a2e;
            font-weight: 600;
        }

        .btn {
            display: inline-block;
            padding: 14px 36px;
            background: #4f6ef7;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            border-radius: 40px;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 6px 20px rgba(79, 110, 247, 0.3);
        }

        .btn:hover {
            background: #3b5de7;
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .notice {
            margin-top: 24px;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid #e9edf4;
            padding-top: 20px;
        }

        .notice a {
            color: #4f6ef7;
            text-decoration: none;
            font-weight: 500;
        }

        .notice a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .maintenance-card {
                padding: 30px 20px 30px;
            }
            .icon { font-size: 56px; }
            h1 { font-size: 26px; }
            .btn { padding: 12px 28px; font-size: 15px; }
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <div class="icon">🔧</div>
        <h1>站点更新维护中</h1>
        <p class="sub">
            感谢您的关注！<br>
            我们正在对网站进行升级与优化，<br>
            在此期间，您可以通过下方链接访问我们的备用站点。
        </p>

        <!-- 理想阁官网 -->
        <a href="https://www.li325.com" target="_blank" class="btn">
            前往 www.li325.com →
        </a>

        <div class="notice">
            如有紧急问题，可发送邮件至 <a href="liranqing2008@Gmail.com">liranqing2008@Gmail.com</a>
        </div>
    </div>

</body>
</html>
